name: CI

on:
  pull_request:
  push:
    branches: [feat/student-tracking, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # npm ci installs exactly what package-lock.json pins. If the lockfile
      # drifts from package.json this fails here rather than silently resolving
      # different versions than the ones that were tested.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. The app must build without real secrets;
          # anything that needs them is deferred to request time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # A route can be dead while build, type-check, lint and the unit tests all
  # pass. /sign-in returned 500 for exactly that reason: it is force-dynamic, so
  # `next build` never rendered it, and next-intl was installed but never wired
  # through its plugin (ADR-014). This job exercises the routes over HTTP in a
  # real browser against a production build, which is the only check that could
  # have failed.
  smoke:
    name: Public pages smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runners only. The browsers are never installed on a developer machine —
      # this project's own sandbox cannot run them at all.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.mjs starts the app itself (`next build && next start`)
      # unless SMOKE_BASE_URL is set, so this step owns no server of its own.
      - name: Run smoke suite
        run: npm run test:smoke
        env:
          # Same build-time placeholders as the quality job: the app must build
          # without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SMOKE_PORT: "3000"

      # Traces and failure screenshots are the whole point of running this in CI;
      # without them a red job says "a page was broken" and nothing more.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Proves the baseline can build a database from nothing, with no cloud project
  # involved. Everything here runs against `supabase start` on the runner, so this
  # job touches no secret, no test project and no legacy project — it cannot.
  #
  # 0010-0015 are in supabase/migrations/archive/ on this branch so the reset
  # replays 0000_baseline.sql alone. If the assertions pass, the baseline really
  # does reconstruct the schema those files used to add.
  baseline:
    name: Baseline rebuild (0000 only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Docker, no cloud)
        run: supabase start

      # Replays every file in supabase/migrations in filename order, which on this
      # branch is 0000_baseline.sql and nothing else.
      - name: Rebuild from the baseline alone
        run: supabase db reset

      - name: Assert the schema the baseline claims to build
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          q() { psql "$DB" -tAc "$1"; }

          tables=$(q "select count(*) from information_schema.tables
                       where table_schema='public' and table_type='BASE TABLE'")
          [ "$tables" = "20" ] || fail "expected 20 public tables, found $tables"

          [ "$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                   where n.nspname='public' and p.proname='has_privilege_probe'")" = "1" ] \
            || fail "has_privilege_probe() missing"

          [ "$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                   where n.nspname='public' and p.proname='has_role'")" = "1" ] \
            || fail "has_role() missing"

          [ "$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid
                   join pg_namespace n on n.oid=c.relnamespace
                   where n.nspname='auth' and c.relname='users'
                     and t.tgname='on_auth_user_created' and not t.tgisinternal")" = "1" ] \
            || fail "on_auth_user_created trigger missing from auth.users"

          for t in students student_grades student_submissions student_alerts \
                   student_interventions teacher_alert_settings; do
            [ "$(q "select has_table_privilege('anon','public.$t','SELECT')
                     or has_table_privilege('anon','public.$t','INSERT')
                     or has_table_privilege('anon','public.$t','UPDATE')
                     or has_table_privilege('anon','public.$t','DELETE')")" = "f" ] \
              || fail "anon still holds a privilege on $t"
          done

          # 0015: a session that names another teacher as owner must be refused with
          # 42501. The before-insert trigger fires ahead of the foreign key, so the
          # error is the trigger's, not a referential one.
          out=$(psql "$DB" -v ON_ERROR_STOP=0 2>&1 <<'SQL'
          set role authenticated;
          set request.jwt.claims = '{"sub":"00000000-0000-0000-0000-00000000aaaa","role":"authenticated"}';
          insert into public.students (teacher_id, name, grade_level)
          values ('00000000-0000-0000-0000-00000000bbbb','spoof','G7');
          SQL
          )
          case "$out" in
            *42501*) echo "0015 enforced: $out" ;;
            *) fail "a spoofed teacher_id was NOT refused with 42501. Output: $out" ;;
          esac

          echo "baseline rebuild verified: 20 tables, probe, has_role, auth trigger, 0015, anon closed."

      # The suite is the real consumer of this schema, so run it against the local
      # instance if it can run unmodified. Local URL and keys are generated by
      # `supabase start` inside this job; no secret is read.
      - name: Isolation suite against the rebuilt database
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm ci
          npm run test:isolation

  isolation:
    name: RLS isolation (real sessions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite creates two throwaway accounts, so it needs credentials.
      #
      # When they are absent the job does NOT silently pass: it emits an
      # explicit warning annotation and marks the step `skipped` via an output.
      # A separate check (below) turns the job red the moment secrets exist but
      # the suite still fails, so the proof cannot be quietly lost.
      - name: Check credentials
        id: creds
        env:
          TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          TEST_ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          TEST_SERVICE: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$TEST_URL" ] || [ -z "$TEST_ANON" ] || [ -z "$TEST_SERVICE" ]; then
            echo "::warning title=Isolation tests not run::SUPABASE_TEST_URL / SUPABASE_TEST_ANON_KEY / SUPABASE_TEST_SERVICE_ROLE_KEY are not set. Add them under Settings -> Secrets and variables -> Actions to enable the tenant-isolation proof."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run isolation suite
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          set +e
          npm run test:isolation 2>&1 | tee isolation.log
          status=${PIPESTATUS[0]:-$?}
          if [ "$status" -ne 0 ]; then
            echo "::error::isolation suite failed — failures below"
            grep -E "^(FAIL|XFAIL)" isolation.log || true
          fi
          exit "$status"

      # The alert's basis sentence is a claim about rows; this proves the claim
      # resolves to real records and that a false one is detectable.
      - name: Verify alert evidence claims
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:evidence

      # A canary that dies mid-run can leave a weakened policy behind. This step
      # snapshots the policy definitions before the canary and restores them
      # after, whatever happened in between.

  canary:
    name: Canary — the isolation suite can fail
    runs-on: ubuntu-latest
    # The isolation and evidence suites share one database with this job. Running
    # them concurrently would let one job's fixture satisfy another job's breach.
    needs: isolation
    # A security test that cannot fail proves nothing. This job injects a real
    # breach into the database, requires the isolation suite to catch it, and
    # restores the schema afterwards (in a finally block).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check credentials
        id: creds
        env:
          TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          TEST_ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          TEST_SERVICE: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          MGMT: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -z "$TEST_URL" ] && missing="$missing SUPABASE_TEST_URL"
          [ -z "$TEST_ANON" ] && missing="$missing SUPABASE_TEST_ANON_KEY"
          [ -z "$TEST_SERVICE" ] && missing="$missing SUPABASE_TEST_SERVICE_ROLE_KEY"
          [ -z "$MGMT" ] && missing="$missing SUPABASE_MANAGEMENT_TOKEN"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::warning title=Canary not run::Missing secrets:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # A canary that dies mid-run can leave a weakened policy behind. This runs
      # first and its output is the ground truth a recovery would read; it is also
      # what caught a silent "0 issues" run in the past.
      - name: Snapshot policies (before)
        if: steps.creds.outputs.configured == 'true'
        env:
          MGMT: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node tests/security/snapshot.mjs > policies-before.json 2>&1 || { echo "::error::policy snapshot failed"; cat policies-before.json; exit 1; }
          python3 - <<'PY' || true
          import json
          rows = json.load(open("policies-before.json"))
          print(f"{len(rows)} policies captured")
          for r in rows:
              print(f"  {r['tablename']}.{r['policyname']} [{r['cmd']}]")
          PY

      - name: Run canary
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run test:canary
