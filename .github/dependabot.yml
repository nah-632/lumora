version: 2

updates:
  # Runtime and build dependencies. Security fixes are opened immediately;
  # routine bumps are grouped so they can be reviewed in one pass.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Bahrain
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor updates together: low risk, reviewed as a batch.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Next 14 is pinned deliberately (see DECISIONS.md ADR-009). A major
      # upgrade is a planned migration, not an automated pull request.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
